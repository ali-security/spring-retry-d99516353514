name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build jar
        run: ./mvnw -B compile jar:jar -Dmaven.javadoc.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: spring-retry-jar
          path: target/spring-retry-1.2.4.RELEASE.jar
